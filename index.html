<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#c7dfcf" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Таня и кот" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <title>Таня и голодный кот</title>
  </head>
  <body>
    <main id="game" aria-label="Игра: Таня и голодный кот"></main>
    <div id="hud">
      <div class="energy-card"><span>Энергия <b id="energy-value">100</b></span><div class="energy-track" role="progressbar" aria-label="Энергия Тани" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="energy-fill"></div></div></div>
      <div class="hud-right"><button id="install" type="button">Установить</button><div class="goal">Покорми котика <span id="distance">→</span></div></div>
    </div>
    <div id="hint"><div>Таня бежит сама<br>Тапни в любом месте, чтобы прыгнуть<small>На компьютере: Space / ↑ — прыжок</small></div></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="portrait"><span>↻</span>Удобнее играть горизонтально<small>Поверни телефон</small></div>
    <div id="ending" hidden><div class="end-card"><div class="cat-icon">🐈</div><h1>Котик спасён ❤️</h1><p>Таня дошла. Котик поел. Всё получилось.</p><button id="replay" type="button">Сыграть ещё раз</button></div></div>
    <dialog id="install-dialog"><h2>Таня на телефоне</h2><p id="install-instructions"></p><p id="offline-status">Для установки открой игру по HTTPS-ссылке.</p><button id="install-close" type="button">Понятно</button></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
